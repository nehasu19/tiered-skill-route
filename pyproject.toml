[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiered-skill-router"
version = "0.1.0"
description = "Run portable SKILL.md workflows across a 3-tier model routing and fail-over architecture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls real models via litellm (needs RUN_LIVE=1 and provider API keys)"]
