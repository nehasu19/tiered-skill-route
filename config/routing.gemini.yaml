# UNVERIFIED: check model IDs and price_per_mtok against the provider before trusting cost numbers.
# Model IDs are litellm model strings. Swap in any provider, e.g.
#   openai/gpt-5-mini, gemini/gemini-2.5-flash, anthropic/gemini/gemini-2.5-flash
# Prices are USD per 1M tokens (used only for the cost estimate in metrics).
tiers:
  1:
    name: fast_worker
    model: gemini/gemini-2.5-flash
    effort: low
    price_per_mtok: {input: 0.10, output: 0.50}
  2:
    name: balanced_orchestrator
    model: gemini/gemini-2.5-pro
    effort: medium
    price_per_mtok: {input: 2.00, output: 10.00}
  3:
    name: flagship_escalation
    model: gemini/gemini-2.5-pro
    effort: high
    price_per_mtok: {input: 4.00, output: 20.00}

# Reasoning effort ladder; a retry on the same tier moves one step up (capped at the top).
effort_ladder: [low, medium, high]

limits:
  max_retries_per_tier: 1      # extra attempts on a tier after the first one fails validation
  max_total_attempts: 6        # hard cap across all tiers; no infinite loops
  bump_effort_on_retry: true
  max_output_tokens: 2048

# Escalation is strictly upward and follows this order. Downgrades are never allowed.
escalation:
  order: [1, 2, 3]
  allow_downgrade: false
  escalation_rate_warn: 0.30   # report a skill if more than 30% of its runs escalate

# The pre-call router takes the HIGHEST tier any rule asks for.
routing:
  token_threshold_tier2: 2000  # estimated input tokens (chars/4) >= this -> at least tier 2
  token_threshold_tier3: 8000  # >= this -> tier 3
  complexity_tier: {simple: 1, multi_step: 2, hard: 3}
  step_rules: {plan: 2, orchestrate: 2, validate: 2}
  skill_rules: {}              # e.g. {my-skill: {min_tier: 2}}
  case_rules:                  # every key in `when` must equal the task attribute
    - {when: {case_id: known-ambiguous}, tier: 3}
